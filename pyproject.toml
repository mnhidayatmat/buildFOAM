[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name carries the product name; the *import* package does not
# (see src/foamwb/branding.py and NFR-M5). This file is part of the declared
# migration-shim surface for a rename.
name = "buildfoam"
version = "0.0.0"
description = "A desktop workbench for OpenFOAM"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hidayat" }]
keywords = ["openfoam", "cfd", "simulation", "gui"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

# The service layer is pure standard library and stays that way: it is exercised
# headlessly by the test suite and could later back a CLI (NFR-M1, §4.1). Qt is
# an application dependency, confined to src/foamwb/ui/ and enforced by
# tools/check_no_qt.py. Pinned by hash at packaging time per §10.2.
dependencies = [
  "PySide6>=6.9,<7",
  # Live plotting, per §13.2's anticipated choice. pyqtgraph over matplotlib
  # because it is Qt-native and built for streaming data: NFR-P4 gives 500 ms
  # from a .dat write to the plot updating, which matplotlib's redraw cost makes
  # awkward at the point where it matters most — a long run with many series.
  # It is also a fifth of the size, which NFR-P8's installer budget notices.
  "pyqtgraph>=0.13",
]

[project.scripts]
# The entry point lives in the presentation layer because it constructs a
# QApplication. A src/foamwb/__main__.py would put a Qt import outside ui/.
buildfoam = "foamwb.ui.app:main"

[project.urls]
Homepage = "https://github.com/mnhidayatmat/buildFOAM"
Issues = "https://github.com/mnhidayatmat/buildFOAM/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-qt>=4.4",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foamwb"]
# The manifest and the form schemas are read at runtime through
# importlib.resources, so they must be in the wheel (§3.4, §5.4).
artifacts = ["src/foamwb/data/**/*.json"]

# --------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # use pathlib
  "RUF",
]
ignore = [
  # `id` as a dataclass field name is the right word for an error code.
  "A003",
]

# Physics notation, whitelisted individually rather than by disabling the rule.
# The ambiguous-unicode checks exist to catch homoglyph attacks; these are the
# actual symbols the quantities are written with, and a CFD tool that spelled nu
# as "v" would be harder to check against the literature it cites.
allowed-confusables = ["ν", "ρ", "τ", "ε", "ω", "α", "μ", "×", "–", "‐"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Qt's event handlers are camelCase because they override Qt's own methods.
# Renaming them would simply stop them being called.
"src/foamwb/ui/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["foamwb"]

# --------------------------------------------------------------------------
# Test / coverage
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: takes more than a second; excluded from the fast pre-commit loop",
  "requires_runtime: needs a provisioned OpenFOAM runtime (§12.5 integration)",
]

[tool.coverage.run]
source = ["src/foamwb"]
branch = true

[tool.coverage.report]
# NFR-M2: >=60% overall, >=80% on FoamDict, CaseService and RunController. The
# per-module floor is asserted separately once those modules exist (M1, M2, M4);
# raising this global number is not a substitute for it.
fail_under = 60
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abc.abstractmethod",
  "@abstractmethod",
]
