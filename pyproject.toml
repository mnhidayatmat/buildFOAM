[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name carries the product name; the *import* package does not
# (see src/foamwb/branding.py and NFR-M5). This file is part of the declared
# migration-shim surface for a rename.
name = "buildfoam"
version = "0.0.0"
description = "A desktop workbench for OpenFOAM"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hidayat" }]
keywords = ["openfoam", "cfd", "simulation", "gui"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

# Empty by design at M0. The service layer is pure standard library so that it
# stays testable headlessly (NFR-M1) and the dependency surface stays auditable
# (§10.2). PySide6 arrives with the shell at M1, under the `gui` extra below
# until the application entry point exists.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.9,<7"]

[project.urls]
Homepage = "https://github.com/hidayat/buildfoam"
Issues = "https://github.com/hidayat/buildfoam/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foamwb"]

# --------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # use pathlib
  "RUF",
]
ignore = [
  # `id` as a dataclass field name is the right word for an error code.
  "A003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["foamwb"]

# --------------------------------------------------------------------------
# Test / coverage
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: takes more than a second; excluded from the fast pre-commit loop",
  "requires_runtime: needs a provisioned OpenFOAM runtime (§12.5 integration)",
]

[tool.coverage.run]
source = ["src/foamwb"]
branch = true

[tool.coverage.report]
# NFR-M2: >=60% overall, >=80% on FoamDict, CaseService and RunController. The
# per-module floor is asserted separately once those modules exist (M1, M2, M4);
# raising this global number is not a substitute for it.
fail_under = 60
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abc.abstractmethod",
  "@abstractmethod",
]
