name: CI

# Both desktop platforms from M0 (§3.1). Linux is not a desktop target (NG4) but
# joins as a CI-only job at M2, when the golden-case regression (§12.3) needs a
# real OpenFOAM install to run the same RunPlan code path through NativeSession.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  guards:
    # The architectural guards are platform-independent and cheap, so they run
    # once and fail fast rather than three times in the matrix.
    name: Architectural guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: NFR-M1 — service layer imports no Qt
        run: uv run python tools/check_no_qt.py

      - name: NFR-M5 — product name appears exactly twice
        run: uv run python tools/check_branding.py

      - name: NFR-M3 — no version or lineage literals in code
        run: uv run python tools/check_version_literals.py

      - name: NFR-A5 — user-visible strings are externalised
        run: uv run python tools/check_translatable.py

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Test
        # Qt widget tests render offscreen (set in tests/conftest.py), so the
        # matrix needs no display server. Includes the §12.5 automated contrast
        # check and the §12.2 round-trip gate over the vendored corpus, which is
        # why the corpus is committed rather than fetched: CI has no OpenFOAM
        # until M2. The wide sweep over a full tutorial suite is opt-in and runs
        # locally (FOAMWB_TUTORIALS=... pytest -m slow).
        #
        # NFR-M2 coverage floors are configured in pyproject; the per-module
        # 80% floor on CaseService and RunController is asserted separately once
        # those modules exist (M2, M4).
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  golden:
    # §12.3's numerical gate. Linux, because that is where OpenFOAM installs from
    # a package repository without a GUI installer — NG4 rules out a Linux
    # *desktop* build, not a Linux CI runner.
    #
    # The container digest and the OpenFOAM package version are pinned and are
    # part of the reference, not incidental to it: §12.3 defines the gate on
    # scalar functionals captured on a pinned toolchain, because CFD output is
    # not bit-reproducible across compiler, MPI or CPU generation.
    #
    # Reference values are regenerated only by an explicit, reviewed commit that
    # also states why. A drift is a defect until proven to be an intended
    # upstream change.
    name: Golden-case regression (§12.3)
    runs-on: ubuntu-latest
    container:
      image: opencfd/openfoam-default:2512
      options: --user root
    steps:
      - name: Tools the OpenFOAM image does not ship
        # actions/checkout falls back to a tarball download without git, and
        # setup-uv needs curl. Installing them explicitly beats debugging a
        # confusing checkout failure later.
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Confirm the runtime is actually present
        # Fails loudly here rather than letting every test skip itself further
        # down. Detection finds the Linux install through the manifest's `linux`
        # block, and this step prints what it looked for — the first run failed
        # here with nothing but an exit code, which cost a whole round trip to
        # diagnose. A CI step that can fail should say why on the way out.
        #
        # Note the image sets no OpenFOAM environment: its variables come from
        # the ENTRYPOINT, which GitHub Actions replaces. Detection therefore has
        # to find the installation on disk rather than trust $WM_PROJECT_DIR.
        run: |
          uv run python - <<'PROBE'
          from pathlib import Path
          from foamwb.services.runtime import RuntimeManager, load_manifest

          manifest = load_manifest()
          print("== looked for ==")
          for version in manifest.versions:
              spec = manifest.release(version).platform("linux")
              root = Path(spec.get("root"))
              print(f"  {version}: root={root} exists={root.is_dir()}")
              for name in ("etc/openfoam", "etc/bashrc"):
                  print(f"      {name}: {(root / name).is_file()}")

          print("== what is actually there ==")
          for probe in (Path("/usr/lib/openfoam"), Path("/opt"), Path("/openfoam")):
              if probe.is_dir():
                  print(f"  {probe}: {sorted(p.name for p in probe.iterdir())[:12]}")

          status = RuntimeManager().detect()
          print(f"== detect(): {status.state.value} {status.openfoam_version} {status.detail}")
          assert status.is_usable, status.detail
          PROBE

      - name: Numerical gate
        # Editor-invariance rows run on any toolchain: they compare two runs on
        # this machine and prove the editor changed nothing numerical. Rows that
        # compare against stored reference numbers skip themselves when the
        # toolchain differs, naming the mismatch — a cross-toolchain comparison
        # is invalid, not merely lenient.
        env:
          # Turns "no OpenFOAM here" from an acceptable local condition into a
          # build failure. In this job a skip means the runtime never installed,
          # and a gate that skips silently is worse than no gate.
          FOAMWB_REQUIRE_RUNTIME: "1"
        run: uv run pytest -m requires_runtime -v
